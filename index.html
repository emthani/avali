<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پس‌زمینه ذرات متصل به ماوس</title>
    <style>
        /* رفع حاشیه‌ها و پر کردن کل صفحه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #07080e; /* رنگ پس‌زمینه (می‌تونی عوض کنی) */
            overflow: hidden;    /* اسکرول رو مخفی می‌کنه تا صفحه تمیز بمونه */
            width: 100vw;
            height: 100vh;
            font-family: 'Tahoma', sans-serif;
        }

        /* ---------- کانواس (جایی که ذرات رسم می‌شن) ---------- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            pointer-events: none; /* این باعث میشه موس از داخل کانواس رد بشه و ماوس‌اور روی متن‌ها کار کنه */
        }

        /* ---------- محتوای متنی که روش می‌نویسی ---------- */
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* بالاتر از کانواس */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            /* برای اینکه متن‌ها خوانا باشن، یه سایه نرم بهشون می‌دیم */
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 0, 0, 0.6);
        }

        .content h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .content p {
            font-size: 1.5rem;
            color: #c8d6e5;
            max-width: 700px;
            line-height: 1.8;
            font-weight: 400;
        }

        .content .sub {
            font-size: 1rem;
            color: #8896b8;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 2.5rem;
            }
            .content p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== کانواس برای ذرات ===== -->
    <canvas id="particles-canvas"></canvas>

    <!-- ===== محتوای متنی (هر چی دوست داری اینجا بنویس) ===== -->
    <div class="content">
        <h1></h1>
        <p>
         <br />
        </p>
        <div class="sub">
        </div>
    </div>

    <!-- ============================================================= -->
    <!-- ===== SCRIPT (همون کد خفن ذرات) ===== -->
    <script>
        // --------------------------------------------------------------
        // 1. راه‌اندازی بوم (Canvas)
        // --------------------------------------------------------------
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const particles = [];
        const mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --------------------------------------------------------------
        // 2. کلاس ذره (Particle)
        // --------------------------------------------------------------
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; // سرعت حرکت افقی
                this.vy = (Math.random() - 0.5) * 0.5; // سرعت حرکت عمودی
                this.radius = Math.random() * 2.8 + 0.8; // اندازه ذرات
                this.alpha = Math.random() * 0.7 + 0.2; // شفافیت
            }

            // به‌روزرسانی موقعیت
            update() {
                this.x += this.vx;
                this.y += this.vy;

                // برگشت از لبه‌ها
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            // رسم ذره
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(79, 172, 254, ${this.alpha})`; // رنگ آبی
                ctx.fill();
            }
        }

        // ساخت ۱۳۰ ذره
        const PARTICLE_COUNT = 130;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // --------------------------------------------------------------
        // 3. رسم خطوط بین ذرات و اتصال به ماوس
        // --------------------------------------------------------------
        function drawLines() {
            // خطوط بین خود ذرات
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 170) {
                        const opacity = 0.2 * (1 - dist / 170);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(79, 172, 254, ${opacity})`;
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }
            }

            // خطوط اتصال به ماوس
            for (const p of particles) {
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 130) {
                    const opacity = 0.35 * (1 - dist / 130);
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = `rgba(0, 242, 254, ${opacity})`; // رنگ فیروزه‌ای برای موس
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // --------------------------------------------------------------
        // 4. حلقه انیمیشن
        // --------------------------------------------------------------
        function animate() {
            // پاک‌سازی صفحه
            ctx.clearRect(0, 0, width, height);

            // به‌روزرسانی و رسم ذرات
            for (const p of particles) {
                p.update();
                p.draw();
            }

            // رسم خطوط
            drawLines();

            // حلقه بعدی
            requestAnimationFrame(animate);
        }

        animate();

        // --------------------------------------------------------------
        // 5. دریافت موقعیت ماوس (و لمس برای موبایل)
        // --------------------------------------------------------------
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch) {
                mouse.x = touch.clientX;
                mouse.y = touch.clientY;
            }
        }, { passive: true });

        // وقتی موس از صفحه خارج میشه، ماوس رو به بیرون می‌فرستیم تا خطوط قطع بشن
        document.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        console.log('🔥 افکت ذرات با موفقیت اجرا شد! حالا هر چی دوست داری توی .content بنویس.');
    </script>
</body>
</html>
